# Add these locations inside the HTTPS server block for cdn.muzes.xyz.
# Autumn may use a 500 MB global ceiling only while every public POST passes
# through this authorisation subrequest.

location = /_tuki_upload_auth {
    internal;
    proxy_pass http://127.0.0.1:14800/v1/uploads/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Session-Token $http_x_session_token;
    proxy_set_header X-Bot-Token $http_x_bot_token;
    proxy_set_header X-Tuki-Upload-Method POST;
    proxy_set_header X-Tuki-Upload-URI $request_uri;
    proxy_set_header X-Tuki-Upload-Size $http_content_length;
    proxy_set_header X-Real-IP $remote_addr;
}

location ~ ^/(attachments|avatars|backgrounds|banners|icons|emojis)/?$ {
    # A browser sends this before a cross-origin upload. The rewrite-phase
    # return runs before auth_request, so only the real POST is authorised.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Session-Token, X-Bot-Token" always;
        add_header Access-Control-Max-Age 600 always;
        return 204;
    }

    limit_except POST OPTIONS { deny all; }
    auth_request /_tuki_upload_auth;
    client_max_body_size 501m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:14704;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:14704;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
